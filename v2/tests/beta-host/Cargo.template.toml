[package]
name = "markdown-reference-beta-host"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
[lib]
path = "../beta-harness/src/lib.rs"
test = false
doctest = false
[dependencies]
tezbar-markdown-reference = { path = "../.." }
serde_json = "=1.0.140"
tauri = { path = "../tauri-stub" }
log = "=0.4.27"
tempfile = "=3.19.1"
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "=1.16.0", features = ["v4"] }
